[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Mantiene las rutas /api/... que utiliza el JavaScript del sitio.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Endpoint JSON alternativo para integraciones futuras.
# El formulario visible utiliza Netlify Forms para registrar solicitudes.
[[redirects]]
  from = "/api/reservations"
  to = "/.netlify/functions/reservations"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[build.environment]
  NODE_VERSION = "22"
